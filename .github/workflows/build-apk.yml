name: Build VF6 Launcher APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        run: |
          set -o pipefail
          gradle :app:assembleDebug :driving:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload main APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VF6Launcher-v0.2-main-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload driving APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VF6Launcher-v0.2-driving-debug-apk
          path: driving/build/outputs/apk/debug/driving-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VF6Launcher-v0.2-build-log
          path: build.log
          if-no-files-found: ignore
